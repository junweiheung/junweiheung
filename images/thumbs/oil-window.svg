<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    .in{opacity:0;animation:fade .9s ease forwards}
    .d1{animation-delay:.3s}.d2{animation-delay:1.1s}.d3{animation-delay:1.9s}
    @keyframes fade{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}}
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="120" y="120" fill="#fff" font-size="48" font-weight="700">The price behind the price</text>
  <text x="120" y="172" fill="#8d8a84" font-size="26">One timestamp sets the number oil is sold against</text>

  <g class="in d1">
    <circle cx="380" cy="520" r="200" fill="none" stroke="#26262a" stroke-width="18"/>
    <circle cx="380" cy="520" r="200" fill="none" stroke="#e0b65a" stroke-width="18" stroke-linecap="round" stroke-dasharray="1257" stroke-dashoffset="0" transform="rotate(-90 380 520)"/>
    <text x="380" y="545" fill="#fff" font-size="120" font-weight="800" text-anchor="middle">16:30</text>
    <text x="380" y="600" fill="#8d8a84" font-size="28" text-anchor="middle">London · Singapore</text>
  </g>
  <g class="in d2"><text x="760" y="440" fill="#e0b65a" font-size="150" font-weight="800">~78%</text><text x="760" y="490" fill="#cfcbc3" font-size="32">of exported crude priced off Brent</text></g>
  <g class="in d3"><text x="760" y="650" fill="#cfcbc3" font-size="72" font-weight="800">25,000 bbl</text><text x="760" y="700" fill="#8d8a84" font-size="30">the size of one Dubai trade</text></g>
</svg>
