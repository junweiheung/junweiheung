<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .st{opacity:0;animation:in .45s ease-out forwards}
    .s1{animation-delay:.05s}.s2{animation-delay:.15s}.s3{animation-delay:.25s}.s4{animation-delay:.35s}.s5{animation-delay:.45s}.s6{animation-delay:.6s}.s7{animation-delay:.75s}.s8{animation-delay:.9s}
    .tok{opacity:0;animation:in .3s ease-out forwards}
    .t1{animation-delay:1.1s}.t2{animation-delay:1.3s}.t3{animation-delay:1.5s}.t4{animation-delay:1.7s}.t5{animation-delay:1.9s}
    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.st,.tok{animation:none;opacity:1}}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="120" y="130" fill="#fff" font-size="56" font-weight="700">What happens when you press send</text>
  <text x="120" y="184" fill="#8d8a84" font-size="28">One message through a data centre, and the chips racing to answer it</text>

  <!-- the request path -->
  <g font-size="24" font-weight="700" text-anchor="middle">
    <g class="st s1"><rect x="120" y="300" width="150" height="64" rx="8" fill="#1c1c21"/><text x="195" y="341" fill="#cfcbc3">Message</text></g>
    <g class="st s2"><rect x="290" y="300" width="120" height="64" rx="8" fill="#1c1c21"/><text x="350" y="341" fill="#cfcbc3">API</text></g>
    <g class="st s3"><rect x="430" y="300" width="150" height="64" rx="8" fill="#1c1c21"/><text x="505" y="341" fill="#cfcbc3">Tokenise</text></g>
    <g class="st s4"><rect x="600" y="300" width="120" height="64" rx="8" fill="#1c1c21"/><text x="660" y="341" fill="#cfcbc3">Route</text></g>
    <g class="st s5"><rect x="740" y="300" width="160" height="64" rx="8" fill="#1c1c21"/><text x="820" y="341" fill="#cfcbc3">Schedule</text></g>
    <g class="st s6"><rect x="920" y="300" width="150" height="64" rx="8" fill="#e01e2b"/><text x="995" y="341" fill="#fff">Prefill</text></g>
    <g class="st s7"><rect x="1090" y="300" width="150" height="64" rx="8" fill="#e01e2b"/><text x="1165" y="341" fill="#fff">Decode ↻</text></g>
    <g class="st s8"><rect x="1260" y="300" width="220" height="64" rx="8" fill="#f0b23a"/><text x="1370" y="341" fill="#0d0d0f">Response</text></g>
  </g>
  <text x="920" y="404" fill="#ff5a63" font-size="22" font-weight="700">limited by arithmetic · then by memory</text>

  <!-- decode, one token at a time -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="30">
    <g class="tok t1"><rect x="120" y="500" width="110" height="54" rx="6" fill="#fbe4e5"/><text x="140" y="537" fill="#7a1018">Sun</text></g>
    <g class="tok t2"><rect x="240" y="500" width="120" height="54" rx="6" fill="#e3ebfb"/><text x="258" y="537" fill="#1d3d7a">light</text></g>
    <g class="tok t3"><rect x="370" y="500" width="90" height="54" rx="6" fill="#fbf0d8"/><text x="388" y="537" fill="#6e4d0b">␣is</text></g>
    <g class="tok t4"><rect x="470" y="500" width="230" height="54" rx="6" fill="#e2f2e6"/><text x="488" y="537" fill="#1f5a2e">␣scattered</text></g>
    <g class="tok t5"><rect x="710" y="500" width="90" height="54" rx="6" fill="#efe3fb"/><text x="728" y="537" fill="#4d2177">␣by</text></g>
  </g>

  <!-- three answers -->
  <g font-size="26" font-weight="700">
    <rect x="120" y="650" width="420" height="120" rx="10" fill="#17171b" stroke="#2e4a73" stroke-width="3"/>
    <text x="150" y="702" fill="#fff">GPU + HBM</text><text x="150" y="742" fill="#8d8a84" font-size="21" font-weight="500">Runs anything, waits on memory</text>
    <rect x="590" y="650" width="420" height="120" rx="10" fill="#17171b" stroke="#e07a1f" stroke-width="3"/>
    <text x="620" y="702" fill="#fff">Groq</text><text x="620" y="742" fill="#8d8a84" font-size="21" font-weight="500">Model in on-chip SRAM</text>
    <rect x="1060" y="650" width="420" height="120" rx="10" fill="#17171b" stroke="#a3141f" stroke-width="3"/>
    <text x="1090" y="702" fill="#fff">Taalas</text><text x="1090" y="742" fill="#8d8a84" font-size="21" font-weight="500">Model built into the chip</text>
  </g>
</svg>
