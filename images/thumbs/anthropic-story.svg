<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .b{transform-box:fill-box;transform-origin:bottom;animation:g .7s ease-out both}
    .d1{animation-delay:.1s}.d2{animation-delay:.22s}.d3{animation-delay:.34s}.d4{animation-delay:.46s}.d5{animation-delay:.58s}
    @keyframes g{from{transform:scaleY(0)}to{transform:none}}
    @media (prefers-reduced-motion:reduce){.b{animation:none}}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="120" y="130" fill="#fff" font-size="60" font-weight="700">The Anthropic story</text>
  <text x="120" y="186" fill="#8d8a84" font-size="28">From the OpenAI split to a $1.5 trillion IPO</text>
  <line x1="120" y1="780" x2="1480" y2="780" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="#b8892b">
    <rect class="b d1" x="180" y="759" width="160" height="21"/>
    <rect class="b d2" x="440" y="717" width="160" height="63"/>
    <rect class="b d3" x="700" y="650" width="160" height="130"/>
    <rect class="b d4" x="960" y="450" width="160" height="330"/>
  </g>
  <rect class="b d5" x="1220" y="265" width="160" height="515" fill="#a3141f"/>
  <g font-size="24" fill="#8d8a84" text-anchor="middle">
    <text x="260" y="820">Mar 2025</text><text x="520" y="820">Sep 2025</text><text x="780" y="820">Feb 2026</text><text x="1040" y="820">May 2026</text><text x="1300" y="820">IPO</text>
  </g>
  <g font-size="30" font-weight="800" fill="#fff" text-anchor="middle">
    <text x="260" y="740">$62B</text><text x="520" y="698">$183B</text><text x="780" y="631">$380B</text><text x="1040" y="431">$965B</text><text x="1300" y="246" fill="#e0b65a">$1.5T</text>
  </g>
</svg>
