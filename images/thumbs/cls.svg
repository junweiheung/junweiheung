<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .bar{transform:scaleY(0);transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) forwards}
    .b1{animation-delay:.3s}.b2{animation-delay:.5s}.b3{animation-delay:.7s}.b4{animation-delay:.9s}.b5{animation-delay:1.1s}
    @keyframes grow{to{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.bar{animation:none;transform:scaleY(1)}}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="120" y="120" fill="#fff" font-size="48" font-weight="700">The bank behind the currency market</text>
  <text x="120" y="172" fill="#8d8a84" font-size="26">How a $14tn day of FX settles</text>

  <!-- baseline -->
  <line x1="200" y1="720" x2="1480" y2="720" stroke="#3a3833" stroke-width="3"/>

  <!-- bars: 36 locked, 15 netted, 36 in-group, 3 timing, 10 no safeguard -->
  <g>
    <rect class="bar b1" x="230"  y="420" width="180" height="300" fill="#4d8bff"/>
    <rect class="bar b2" x="470"  y="595" width="180" height="125" fill="#2f9a8a"/>
    <rect class="bar b3" x="710"  y="420" width="180" height="300" fill="#8d8a84"/>
    <rect class="bar b4" x="950"  y="695" width="180" height="25"  fill="#e0b65a"/>
    <rect class="bar b5" x="1190" y="637" width="180" height="83"  fill="#c2412d"/>
  </g>

  <!-- value labels -->
  <g font-size="34" font-weight="800" text-anchor="middle">
    <text x="320"  y="395" fill="#4d8bff">36%</text>
    <text x="560"  y="570" fill="#2f9a8a">15%</text>
    <text x="800"  y="395" fill="#cfcbc3">&gt;35%</text>
    <text x="1040" y="670" fill="#e0b65a">3%</text>
    <text x="1280" y="612" fill="#c2412d">10%</text>
  </g>
  <!-- category labels -->
  <g font-size="22" fill="#76736c" text-anchor="middle">
    <text x="320"  y="765">locked</text>
    <text x="560"  y="765">netted</text>
    <text x="800"  y="765">in-group</text>
    <text x="1040" y="765">timing</text>
    <text x="1280" y="765">no safeguard</text>
  </g>
</svg>
