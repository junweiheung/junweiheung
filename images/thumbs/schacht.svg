<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .b{transform-box:fill-box;transform-origin:bottom;animation:g .7s ease-out both}
    .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}
    @keyframes g{from{transform:scaleY(0)}to{transform:none}}
    @media (prefers-reduced-motion:reduce){.b{animation:none}}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="120" y="130" fill="#fff" font-size="60" font-weight="700">The dark wizard</text>
  <text x="120" y="186" fill="#8d8a84" font-size="28">How Hjalmar Schacht paid for Hitler’s rearmament, 1933–1939</text>
  <text x="120" y="290" fill="#cfcbc3" font-size="24" font-weight="700">Registered unemployed, millions</text>
  <line x1="120" y1="780" x2="1480" y2="780" stroke="#3a3a3a" stroke-width="2"/>
  <g font-size="24" fill="#8d8a84" text-anchor="middle">
    <text x="215" y="820">1933</text><text x="435" y="820">1934</text><text x="655" y="820">1935</text><text x="875" y="820">1936</text><text x="1095" y="820">1937</text><text x="1315" y="820">1938</text>
  </g>
  <g fill="#a3141f">
    <rect class="b d1" x="160" y="330" width="110" height="450"/>
    <rect class="b d2" x="380" y="570" width="110" height="210"/>
    <rect class="b d3" x="600" y="615" width="110" height="165"/>
    <rect class="b d4" x="820" y="645" width="110" height="135"/>
    <rect class="b d5" x="1040" y="705" width="110" height="75"/>
    <rect class="b d6" x="1260" y="745" width="110" height="35"/>
  </g>
  <text x="285" y="360" fill="#fff" font-size="34" font-weight="800">~6M</text>
  <text x="1390" y="730" fill="#e0b65a" font-size="34" font-weight="800" text-anchor="end">Mefo bills: ~12bn RM</text>
</svg>
