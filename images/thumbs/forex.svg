<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .st{opacity:0;animation:in .45s ease-out forwards}
    .s1{animation-delay:.1s}.s2{animation-delay:.25s}.s3{animation-delay:.4s}.s4{animation-delay:.55s}.s5{animation-delay:.7s}
    .bar{transform-origin:left;transform:scaleX(0);animation:grow .9s ease-out forwards}
    .b1{animation-delay:.3s}.b2{animation-delay:.45s}.b3{animation-delay:.6s}.b4{animation-delay:.75s}.b5{animation-delay:.9s}
    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes grow{to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){.st{animation:none;opacity:1}.bar{animation:none;transform:none}}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="120" y="130" fill="#fff" font-size="56" font-weight="700">The $9.6 trillion market</text>
  <text x="120" y="184" fill="#8d8a84" font-size="28">How forex works: pairs, pips, leverage and broken pegs</text>

  <!-- a quote board -->
  <g font-size="30" font-weight="700">
    <g class="st s1"><rect x="120" y="270" width="300" height="110" rx="10" fill="#1c1c21"/><text x="146" y="314" fill="#8d8a84" font-size="22">EUR/USD</text><text x="146" y="358" fill="#fff" font-family="ui-monospace,Menlo,monospace">1.16<tspan fill="#4d8bff">00</tspan></text></g>
    <g class="st s2"><rect x="440" y="270" width="300" height="110" rx="10" fill="#1c1c21"/><text x="466" y="314" fill="#8d8a84" font-size="22">USD/JPY</text><text x="466" y="358" fill="#fff" font-family="ui-monospace,Menlo,monospace">155.<tspan fill="#4d8bff">00</tspan></text></g>
    <g class="st s3"><rect x="760" y="270" width="300" height="110" rx="10" fill="#1c1c21"/><text x="786" y="314" fill="#8d8a84" font-size="22">USD/SGD</text><text x="786" y="358" fill="#fff" font-family="ui-monospace,Menlo,monospace">1.30<tspan fill="#4d8bff">00</tspan></text></g>
    <g class="st s4"><rect x="1080" y="270" width="400" height="110" rx="10" fill="#2a1513" stroke="#c2412d" stroke-width="3"/><text x="1106" y="314" fill="#e08a6f" font-size="22">EUR/CHF · 15 Jan 2015</text><text x="1106" y="358" fill="#fff">Franc +30% in minutes</text></g>
  </g>

  <!-- currency shares -->
  <g font-size="24" font-weight="700">
    <text x="120" y="470" fill="#8d8a84" font-size="22" font-weight="600">Share of trades involving each currency</text>
    <text x="120" y="528" fill="#cfcbc3">USD</text><rect class="bar b1" x="220" y="504" width="1068" height="32" rx="4" fill="#2463d6"/><text x="1304" y="530" fill="#fff">89%</text>
    <text x="120" y="588" fill="#cfcbc3">EUR</text><rect class="bar b2" x="220" y="564" width="347" height="32" rx="4" fill="#5b5953"/><text x="583" y="590" fill="#fff">29%</text>
    <text x="120" y="648" fill="#cfcbc3">JPY</text><rect class="bar b3" x="220" y="624" width="202" height="32" rx="4" fill="#5b5953"/><text x="438" y="650" fill="#fff">17%</text>
    <text x="120" y="708" fill="#cfcbc3">GBP</text><rect class="bar b4" x="220" y="684" width="122" height="32" rx="4" fill="#5b5953"/><text x="358" y="710" fill="#fff">10%</text>
    <text x="120" y="768" fill="#cfcbc3">CNY</text><rect class="bar b5" x="220" y="744" width="102" height="32" rx="4" fill="#5b5953"/><text x="338" y="770" fill="#fff">8.5%</text>
  </g>
  <text class="st s5" x="1480" y="820" fill="#b8892b" font-size="22" font-weight="700" text-anchor="end">Shares add to 200%: every trade has two sides</text>
</svg>
