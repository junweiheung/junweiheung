<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .x{animation:f .5s ease-out forwards}
    .x1{animation-delay:.2s}.x2{animation-delay:.35s}.x3{animation-delay:.5s}
    @keyframes f{to{opacity:.12}}
    @media (prefers-reduced-motion:reduce){.x{animation:none;opacity:.12}}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="120" y="130" fill="#fff" font-size="60" font-weight="700">Shrinking the pie</text>
  <text x="120" y="186" fill="#8d8a84" font-size="28">How companies buy back their own shares</text>
  <g transform="translate(470 540)">
    <path d="M0 0 L0 -260 A260 260 0 0 1 247.3 -80.3 Z" fill="#2463d6"/>
    <path d="M0 0 L247.3 -80.3 A260 260 0 0 1 152.8 210.3 Z" fill="#2f7a4a"/>
    <path d="M0 0 L152.8 210.3 A260 260 0 0 1 -152.8 210.3 Z" fill="#b8892b"/>
    <path class="x x1" d="M0 0 L-152.8 210.3 A260 260 0 0 1 -247.3 -80.3 Z" fill="#a3141f"/>
    <path class="x x2" d="M0 0 L-247.3 -80.3 A260 260 0 0 1 0 -260 Z" fill="#c2412d"/>
    <g stroke="#0d0d0f" stroke-width="6"><line x1="0" y1="0" x2="0" y2="-260"/><line x1="0" y1="0" x2="247.3" y2="-80.3"/><line x1="0" y1="0" x2="152.8" y2="210.3"/><line x1="0" y1="0" x2="-152.8" y2="210.3"/><line x1="0" y1="0" x2="-247.3" y2="-80.3"/></g>
  </g>
  <text x="900" y="470" fill="#e0b65a" font-size="96" font-weight="800">$942.5B</text>
  <text x="900" y="520" fill="#cfcbc3" font-size="26">S&amp;P 500 buybacks in 2024, a record</text>
  <text x="900" y="640" fill="#fff" font-size="44" font-weight="700">25% a day</text>
  <text x="900" y="684" fill="#8d8a84" font-size="24">of average volume: the SEC safe-harbour cap</text>
</svg>
