<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    .rise{stroke-dasharray:3200;stroke-dashoffset:3200;animation:draw 1.9s ease .3s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.rise{animation:none;stroke-dashoffset:0}}
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="150" y="110" fill="#fff" font-size="50" font-weight="800">How AMD came back</text>
  <text x="150" y="162" fill="#8d8a84" font-size="26">AMD share price, US$, log scale · 2014–2026</text>
  <g stroke="#26262b" stroke-width="2"><line x1="150" x2="1450" y1="780" y2="780"/><line x1="150" x2="1450" y1="603" y2="603"/><line x1="150" x2="1450" y1="427" y2="427"/><line x1="150" x2="1450" y1="250" y2="250"/></g>
  <g fill="#6b6b74" font-size="22" text-anchor="end"><text x="136" y="788">$1</text><text x="136" y="611">$10</text><text x="136" y="435">$100</text><text x="136" y="258">$1,000</text></g>
  <polyline class="rise" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" points="170,705 232,743 277,699 383,594 490,601 596,556 703,486 810,433 916,399 1023,460 1129,397 1236,412 1342,368 1420,287 1437,299"/>
  <circle cx="232" cy="743" r="14" fill="#e01e2b" stroke="#fff" stroke-width="4"/>
  <circle cx="1420" cy="287" r="14" fill="#e01e2b" stroke="#fff" stroke-width="4"/>
  <text x="256" y="755" fill="#fff" font-size="34" font-weight="800">$1.62 · 2015</text>
  <text x="1394" y="281" fill="#fff" font-size="34" font-weight="800" text-anchor="end">$1 trillion · 2026</text>
</svg>
