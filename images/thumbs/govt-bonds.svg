<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .bar{transform:scaleY(0);transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
    .b2{animation-delay:.35s}
    .tag{opacity:0;animation:fade .5s ease forwards}
    .t1{animation-delay:.9s}.t2{animation-delay:1.1s}
    @keyframes grow{to{transform:scaleY(1)}}
    @keyframes fade{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.bar{animation:none;transform:scaleY(1)}.tag{animation:none;opacity:1}}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="120" y="120" fill="#fff" font-size="48" font-weight="700">Lending to governments</text>
  <text x="120" y="172" fill="#8d8a84" font-size="26">Two countries, two reasons to borrow</text>

  <line x1="120" y1="760" x2="1480" y2="760" stroke="#3a3833" stroke-width="3"/>
  <line x1="120" y1="420" x2="1480" y2="420" stroke="#26262a" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="1480" y="410" fill="#76736c" font-size="22" text-anchor="end">100% of GDP</text>

  <!-- USA bar -->
  <rect class="bar" x="320" y="470" width="300" height="290" fill="#4d8bff"/>
  <text class="tag t1" x="470" y="440" fill="#4d8bff" font-size="40" font-weight="800" text-anchor="middle">USA</text>
  <text class="tag t1" x="470" y="720" fill="#fff" font-size="30" font-weight="700" text-anchor="middle">borrows to spend</text>

  <!-- Singapore bar (taller: 172%) -->
  <rect class="bar b2" x="980" y="270" width="300" height="490" fill="#e0b65a"/>
  <text class="tag t2" x="1130" y="240" fill="#e0b65a" font-size="40" font-weight="800" text-anchor="middle">172%</text>
  <text class="tag t2" x="1130" y="520" fill="#111" font-size="28" font-weight="700" text-anchor="middle">Singapore</text>
  <text class="tag t2" x="1130" y="556" fill="#111" font-size="22" font-weight="600" text-anchor="middle">to build, not spend</text>
</svg>
