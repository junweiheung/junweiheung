<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    /* the plank, the two bond blocks and the seated figure rock together, forever */
    .rock{animation:rock 4.8s ease-in-out infinite;transform-origin:400px 250px}
    .bub{transform-origin:400px 70px;animation:pop 4.8s ease-in-out .3s infinite}
    @keyframes rock{0%,100%{transform:rotate(-6.5deg)}50%{transform:rotate(6.5deg)}}
    @keyframes pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.06)}}
    @media (prefers-reduced-motion:reduce){.rock,.bub{animation:none}}
  </style>

  <!-- backdrop: pale wall + floor strip, matching the in-article scene -->
  <rect width="800" height="400" fill="#eef2f5"/>
  <rect x="0" y="330" width="800" height="70" fill="#cbd3d8"/>

  <!-- fulcrum -->
  <path d="M400 250 L372 320 L428 320 Z" fill="#8a6d3b"/>

  <g class="rock">
    <!-- plank -->
    <rect x="120" y="242" width="560" height="16" rx="4" fill="#5a4632"/>

    <!-- LEFT end: BOND PRICE, yield down -->
    <g>
      <rect x="150" y="150" width="92" height="64" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>
      <text x="196" y="178" text-anchor="middle" font-size="15" font-weight="800" fill="#111">BOND</text>
      <text x="196" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#b8892b">PRICE</text>
      <text x="196" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#76736c">yield ↓</text>
    </g>

    <!-- RIGHT end: BOND PRICE (dark), yield up -->
    <g>
      <rect x="558" y="150" width="92" height="64" rx="6" fill="#0d0d0f" stroke="#111" stroke-width="3"/>
      <text x="604" y="178" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">BOND</text>
      <text x="604" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#e0b65a">PRICE</text>
      <text x="604" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#76736c">yield ↑</text>
    </g>

    <!-- the Fed, seated at the pivot -->
    <g>
      <!-- hands resting -->
      <ellipse cx="400" cy="246" rx="34" ry="12" fill="#d9a77f"/>
      <!-- suit jacket -->
      <path d="M362 196 Q362 180 378 178 L422 178 Q438 180 438 196 L446 250 L354 250 Z" fill="#2f4a7a"/>
      <!-- shirt + tie -->
      <path d="M387 178 L413 178 L400 226 Z" fill="#f7f5f0"/>
      <path d="M400 184 l-5 6 l3 28 l2 5 l2 -5 l3 -28 z" fill="#c2412d"/>
      <!-- neck -->
      <rect x="392" y="156" width="16" height="22" fill="#d9a77f"/>
      <!-- head -->
      <ellipse cx="400" cy="138" rx="20" ry="24" fill="#d9a77f"/>
      <!-- ears -->
      <circle cx="380" cy="140" r="5" fill="#d9a77f"/>
      <circle cx="420" cy="140" r="5" fill="#d9a77f"/>
      <!-- hair -->
      <path d="M380 136 Q378 108 400 110 Q422 108 420 136 Q412 120 400 121 Q388 120 380 136 Z" fill="#2a2018"/>
      <!-- eyes -->
      <circle cx="393" cy="136" r="2.4" fill="#222"/>
      <circle cx="407" cy="136" r="2.4" fill="#222"/>
      <!-- smile -->
      <path d="M395 150 q5 3 10 0" stroke="#7a3b2e" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- speech bubble: One lever. -->
    <g class="bub">
      <rect x="315" y="20" width="170" height="52" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
      <path d="M394 71 L400 94 L412 71 Z" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
      <rect x="395" y="69" width="16" height="5" fill="#fff"/>
      <text x="400" y="53" text-anchor="middle" font-size="22" font-weight="800" fill="#111">One lever.</text>
    </g>
  </g>
</svg>
