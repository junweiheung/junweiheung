<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .b{transform-box:fill-box;transform-origin:left;animation:g .7s ease-out both}
    .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}
    @keyframes g{from{transform:scaleX(0)}to{transform:none}}
    @media (prefers-reduced-motion:reduce){.b{animation:none}}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="120" y="130" fill="#fff" font-size="60" font-weight="700">Who gets the biggest slice?</text>
  <text x="120" y="186" fill="#8d8a84" font-size="28">Same five companies, three ways to weight them</text>
  <g font-size="26" font-weight="700" fill="#cfcbc3">
    <text x="120" y="300">By company value</text>
    <text x="120" y="500">Equal</text>
    <text x="120" y="700">By share price</text>
  </g>
  <g class="b d1">
    <rect x="120" y="325" width="938" height="80" fill="#2463d6"/><rect x="1058" y="325" width="282" height="80" fill="#2f7a4a"/><rect x="1340" y="325" width="94" height="80" fill="#b8892b"/><rect x="1434" y="325" width="28" height="80" fill="#a3141f"/><rect x="1462" y="325" width="18" height="80" fill="#7a4fb8"/>
  </g>
  <g class="b d2">
    <rect x="120" y="525" width="272" height="80" fill="#2463d6"/><rect x="392" y="525" width="272" height="80" fill="#2f7a4a"/><rect x="664" y="525" width="272" height="80" fill="#b8892b"/><rect x="936" y="525" width="272" height="80" fill="#a3141f"/><rect x="1208" y="525" width="272" height="80" fill="#7a4fb8"/>
  </g>
  <g class="b d3">
    <rect x="120" y="725" width="234" height="80" fill="#2463d6"/><rect x="354" y="725" width="703" height="80" fill="#2f7a4a"/><rect x="1057" y="725" width="59" height="80" fill="#b8892b"/><rect x="1116" y="725" width="352" height="80" fill="#a3141f"/><rect x="1468" y="725" width="12" height="80" fill="#7a4fb8"/>
  </g>
</svg>
