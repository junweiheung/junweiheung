<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .bar{transform:scaleX(0);transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
    .b2{animation-delay:.2s}.b3{animation-delay:.4s}.b4{animation-delay:.6s}
    @keyframes grow{to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){.bar{animation:none;transform:scaleX(1)}}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="120" y="118" fill="#fff" font-size="48" font-weight="700">Three companies, four battlegrounds</text>
  <text x="120" y="166" fill="#8d8a84" font-size="26">AMD · Intel · Nvidia, who leads where</text>

  <!-- four segment bars, each won by a different leader -->
  <g font-size="24" font-weight="700">
    <text x="120" y="290" fill="#cfcbc3">Server CPUs</text>
    <rect class="bar"    x="120" y="305" width="520" height="44" fill="#c2412d"/>
    <text x="150" y="335" fill="#fff" font-size="22">AMD 46.8% cloud</text>

    <text x="120" y="420" fill="#cfcbc3">AI accelerators</text>
    <rect class="bar b2" x="120" y="435" width="900" height="44" fill="#5f9e6e"/>
    <text x="150" y="465" fill="#fff" font-size="22">Nvidia ~78% revenue</text>

    <text x="120" y="550" fill="#cfcbc3">Discrete GPUs</text>
    <rect class="bar b3" x="120" y="565" width="1040" height="44" fill="#5f9e6e"/>
    <text x="150" y="595" fill="#fff" font-size="22">Nvidia ~90%</text>

    <text x="120" y="680" fill="#cfcbc3">PC CPUs (units)</text>
    <rect class="bar b4" x="120" y="695" width="820" height="44" fill="#2463d6"/>
    <text x="150" y="725" fill="#fff" font-size="22">Intel ~70%</text>
  </g>
  <text x="120" y="810" fill="#8d8a84" font-size="22">Different leader in every market. Q3 2026.</text>
</svg>
