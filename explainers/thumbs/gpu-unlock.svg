<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    .ext{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) .6s forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){.ext{animation:none;transform:none}}
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <text x="120" y="120" fill="#fff" font-size="48" font-weight="700">Same card, same power limit</text>
  <text x="120" y="172" fill="#8d8a84" font-size="26">Dense BF16 matrix compute, TFLOPS · grey: as shipped · gold: unlocked</text>

  <text x="120" y="330" fill="#fff" font-size="34" font-weight="700">RTX 3090</text>
  <rect x="340" y="280" width="375" height="90" fill="#1a1a1d"/>
  <rect x="340" y="280" width="225" height="90" fill="#5d5a55"/>
  <rect class="ext" x="565" y="280" width="150" height="90" fill="#e0b65a"/>
  <text x="360" y="336" fill="#fff" font-size="28" font-weight="600">75</text>
  <text x="735" y="338" fill="#e0b65a" font-size="34" font-weight="700">125 TFLOPS  +65%</text>

  <text x="120" y="520" fill="#fff" font-size="34" font-weight="700">RTX 4090</text>
  <rect x="340" y="470" width="987" height="90" fill="#1a1a1d"/>
  <rect x="340" y="470" width="495" height="90" fill="#5d5a55"/>
  <rect class="ext" x="835" y="470" width="492" height="90" fill="#e0b65a"/>
  <text x="360" y="526" fill="#fff" font-size="28" font-weight="600">165</text>
  <text x="1345" y="528" fill="#e0b65a" font-size="34" font-weight="700">329</text>

  <g transform="translate(807,380)">
    <path d="M10 34 V16 a18 18 0 0 1 36 0 V20" fill="none" stroke="#fff" stroke-width="6"/>
    <rect x="0" y="32" width="56" height="44" rx="5" fill="#fff"/>
    <circle cx="28" cy="54" r="6" fill="#0d0d0f"/>
  </g>
  <text x="120" y="720" fill="#77746e" font-size="30">Games +0% · Chatbot replies +0%</text>
</svg>
