<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    .real{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.8s ease .3s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.real{animation:none;stroke-dashoffset:0}}
    text{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  </style>
  <rect width="1600" height="900" fill="#0d0d0f"/>
  <g stroke="#1e1e22" stroke-width="2">
    <line x1="120" x2="1480" y1="250" y2="250"/><line x1="120" x2="1480" y1="360" y2="360"/>
    <line x1="120" x2="1480" y1="470" y2="470"/><line x1="120" x2="1480" y1="580" y2="580"/>
    <line x1="120" x2="1480" y1="690" y2="690"/>
  </g>
  <text x="120" y="110" fill="#fff" font-size="44" font-weight="700">Who keeps each dollar of an AI chip</text>
  <text x="120" y="160" fill="#8d8a84" font-size="26">Dashed: the textbook smile · Gold: 2026</text>
  <polyline fill="none" stroke="#5d5a55" stroke-width="4" stroke-dasharray="12 12" stroke-linejoin="round"
    points="180,338 357,382 534,470 711,567 888,584 1066,558 1243,479 1420,329"/>
  <polyline class="real" fill="none" stroke="#e0b65a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"
