  <g fill="#e0b65a"><circle cx="180" cy="360" r="15"/><circle cx="357" cy="303" r="15"/><circle cx="1066" cy="593" r="15"/><circle cx="1243" cy="664" r="15"/></g>
  <g fill="#4d8bff"><circle cx="534" cy="437" r="15"/><circle cx="711" cy="398" r="15"/><circle cx="888" cy="338" r="15"/></g>
  <circle cx="1420" cy="360" r="13" fill="#0d0d0f" stroke="#e0b65a" stroke-width="5"/>
  <g fill="#fff" font-size="30" font-weight="700" text-anchor="middle">
    <text x="180" y="328">75¢</text><text x="357" y="271">88¢</text><text x="534" y="405">57¢</text><text x="711" y="366">66¢</text>
    <text x="888" y="306">80¢</text><text x="1066" y="561">22¢</text><text x="1243" y="632">6¢</text>
